<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Stream Portal Mov-Vidley | Home</title>

<meta property="og:site_name" content="Portal Media USA">
<meta property="og:title" content="Shared Community Content - Home">
<meta property="og:description" content="Discover and watch trending community shared videos.">
<meta property="og:type" content="website">

<!-- External Libraries -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');

* {
    box-sizing: border-box;
}

body {
    background: #050505;
    background-image: 
        radial-gradient(at 0% 0%, rgba(220, 38, 38, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(0, 0, 0, 0.5) 0px, transparent 50%);
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-user-drag: none;
}

.glass-header {
    background: rgba(10, 10, 12, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.video-card {
    background: rgba(20, 20, 22, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.05);
    transition: all 0.3s ease;
}

.video-card:hover {
    border-color: rgba(220, 38, 38, 0.3);
    box-shadow: 0 10px 30px -10px rgba(220, 38, 38, 0.2);
    transform: translateY(-4px);
}

.video-thumbnail {
    background: #000;
}

::-webkit-scrollbar {
    width: 8px;
}
::-webkit-scrollbar-track {
    background: #050505;
}
::-webkit-scrollbar-thumb {
    background: #333;
    border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
    background: #555;
}
</style>
</head>

<body class="flex flex-col items-center w-full">

<!-- Navigation / Header -->
<nav class="glass-header sticky top-0 w-full z-50 px-4 py-4 md:px-8 flex justify-between items-center">
    <div class="flex items-center gap-3">
        <div class="p-2 bg-red-600/10 rounded-lg">
            <i data-lucide="play" class="w-6 h-6 text-red-500 fill-red-500"></i>
        </div>
        <h1 class="font-black text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">
            MOV<span class="text-red-500">VIDLEY</span>
        </h1>
    </div>
    
    <a href="https://www.facebook.com/groups/1818279898471064" target="_blank" class="hidden md:flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-white/10 rounded-full border border-white/10 transition-colors text-sm font-semibold">
        <i data-lucide="users" class="w-4 h-4"></i>
        Join Community
    </a>
</nav>

<!-- Main Content Area -->
<main class="w-full max-w-7xl px-4 py-8 md:px-8 flex flex-col gap-8">

    <!-- Section Title -->
    <div class="flex items-center gap-3">
        <i data-lucide="trending-up" class="w-6 h-6 text-red-500"></i>
        <h2 class="text-2xl font-bold">Trending Now</h2>
    </div>

    <!-- Video Grid Container -->
    <div id="videoGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-5">
        <!-- Video cards will be injected here by JavaScript -->
    </div>

</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
    
    // Inisialisasi Icon
    lucide.createIcons();

    // ==========================================
    // DATABASE VIDEO (GANTI DENGAN ID VIDEY ANDA)
    // ==========================================
    // Anda hanya perlu memasukkan ID videy di sini.
    // Judul bisa dikosongkan atau diisi bebas.
    const videos = [
        { id: "QiRcldmT1", title: "my daily activities" },
        { id: "PAoHZDoX1", title: "She smiled so happily when the surprise arrived" },
        { id: "aVetY4Xx1", title: "Just cheering her up while she’s feeling sick" },
        { id: "8e3sc9KI1", title: "So thirsty, she had to open the fridge" },
        { id: "UinTtuXY1", title: "just enjoying the little things" },
        { id: "QLWI5PKG1", title: "When you’re driving but your focus is somewhere else" }
    ];

    const grid = document.getElementById('videoGrid');

    // Render setiap video ke dalam grid
    videos.forEach(video => {
        // Karena ext videy bisa .mp4, kita asumsikan default .mp4 jika tidak ada titik
        const filename = video.id.includes('.') ? video.id : video.id + '.mp4';
        const videoUrl = 'https://cdn2.videy.co/' + encodeURIComponent(filename);
        
        // Buat elemen card (Arahkan href ke URL player Anda, misalnya /{id})
        const card = document.createElement('a');
        card.href = video.id; // Ini akan mengarah ke webanda.com/contoh_id_1
        card.className = "video-card group block rounded-xl overflow-hidden cursor-pointer relative";
        
        // HTML Dalam Card
        card.innerHTML = `
            <!-- Wadah Video Thumbnail -->
            <div class="relative aspect-[3/4] video-thumbnail overflow-hidden bg-zinc-900">
                
                <!-- Tag Video dimute dan ditambahkan #t=0.001 untuk mengambil frame pertama sebagai thumbnail -->
                <video 
                    src="${videoUrl}#t=0.001" 
                    class="w-full h-full object-cover opacity-70 group-hover:opacity-100 transition-opacity duration-300"
                    preload="metadata"
                    muted
                    loop
                    playsinline>
                </video>
                
                <!-- Ikon Play di Tengah -->
                <div class="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-transparent transition-all">
                    <div class="w-12 h-12 rounded-full bg-black/50 backdrop-blur-sm flex items-center justify-center border border-white/20 group-hover:scale-110 group-hover:bg-red-600/80 group-hover:border-red-500 transition-all duration-300">
                        <i data-lucide="play" class="w-6 h-6 text-white fill-white ml-1"></i>
                    </div>
                </div>

                <!-- Durasi/Label (Opsional, desain mockup) -->
                <div class="absolute bottom-2 right-2 bg-black/80 backdrop-blur px-2 py-1 rounded text-[10px] font-bold tracking-wider text-white">
                    HD
                </div>
            </div>
            
            <!-- Judul Video -->
            <div class="p-3">
                <h3 class="text-sm font-semibold line-clamp-2 text-gray-200 group-hover:text-white transition-colors">
                    ${video.title}
                </h3>
            </div>
        `;

        // Logika Hover: Play video otomatis saat kursor di atas card (seperti YouTube/TikTok)
        const vidElement = card.querySelector('video');
        
        card.addEventListener('mouseenter', () => {
            // Coba mainkan video, abaikan error jika video belum siap
            let playPromise = vidElement.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    // Auto-play dicegah oleh browser atau video tidak valid (karena dummy ID)
                    console.log("Hover play prevented or dummy ID.");
                });
            }
        });

        card.addEventListener('mouseleave', () => {
            vidElement.pause();
            // Reset ke awal setiap kali mouse keluar agar rapi
            vidElement.currentTime = 0; 
        });

        grid.appendChild(card);
    });

    // Refresh icon untuk elemen yang baru ditambahkan
    lucide.createIcons();
});
</script>

</body>
</html>
