<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Portal | Video Gallery</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        * { box-sizing: border-box; }
        body {
            background: #050505;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            -webkit-user-drag: none;
            background-image: radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.15), transparent 70%);
        }
        .glass-header {
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .video-card {
            background: rgba(20, 20, 22, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .video-card:hover {
            transform: translateY(-4px);
            border-color: rgba(220, 38, 38, 0.3);
            box-shadow: 0 10px 30px -10px rgba(220, 38, 38, 0.15);
        }
        .thumbnail-container {
            width: 100%;
            aspect-ratio: 9/16;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        .thumbnail-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .video-card:hover .thumbnail-container video {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="pb-12">
    <header class="glass-header sticky top-0 z-50 px-4 py-4 mb-6">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="play-square" class="w-6 h-6 text-red-500"></i>
                <h1 class="text-xl font-black tracking-wider text-white uppercase">Portal<span class="text-red-500">Media</span></h1>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4">
        <div class="mb-8">
            <h2 class="text-2xl md:text-3xl font-bold mb-2">Trending Now</h2>
            <p class="text-gray-400 text-sm">Discover the most popular shared community content.</p>
        </div>

        <div id="videoGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-5">
            <!-- Videos will be injected here automatically by Javascript -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // Kumpulan Data Video (ID dan Judul)
            const videos = [
                { id: "QiRcldmT1", title: "my daily activities" },
                { id: "PAoHZDoX1", title: "She smiled so happily when the surprise arrived" },
                { id: "aVetY4Xx1", title: "Just cheering her up while she’s feeling sick" },
                { id: "8e3sc9KI1", title: "So thirsty, she had to open the fridge" },
                { id: "UinTtuXY1", title: "just enjoying the little things" },
                { id: "QLWI5PKG1", title: "When you’re driving but your focus is somewhere else" }
            ];

            const grid = document.getElementById('videoGrid');

            videos.forEach(video => {
                const filename = video.id.includes('.') ? video.id : video.id + '.mp4';
                const videoUrl = 'https://cdn2.videy.co/' + encodeURIComponent(filename);
                
                const card = document.createElement('a');
                // Mengirimkan parameter ID ke pemutar index.html
                card.href = `index.html?v=${video.id}`;
                card.className = "video-card group block rounded-xl overflow-hidden cursor-pointer relative flex flex-col";
                
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <!-- #t=0.001 digunakan agar thumbnail muncul dari frame pertama video -->
                        <video 
                            src="${videoUrl}#t=0.001" 
                            muted 
                            playsinline 
                            preload="metadata"
                            loop
                            crossorigin="anonymous"
                            class="preview-video">
                        </video>
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-black/20">
                            <div class="w-12 h-12 bg-red-600/90 rounded-full flex items-center justify-center backdrop-blur-sm shadow-lg shadow-red-500/30">
                                <i data-lucide="play" class="w-6 h-6 text-white ml-1"></i>
                            </div>
                        </div>
                    </div>
                    <div class="p-3 md:p-4 flex-1 flex flex-col justify-between">
                        <h3 class="text-sm md:text-sm font-semibold text-gray-100 line-clamp-2 leading-snug group-hover:text-red-400 transition-colors">${video.title}</h3>
                    </div>
                `;
                
                grid.appendChild(card);

                // Fitur untuk otomatis Play saat kursor diletakkan (Hover)
                const vidElement = card.querySelector('video');
                card.addEventListener('mouseenter', () => {
                    vidElement.play().catch(e => console.log("Preview play prevented:", e));
                });
                card.addEventListener('mouseleave', () => {
                    vidElement.pause();
                });
            });

            lucide.createIcons();
        });
    </script>
</body>
</html>
