<script>
document.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();

    // 1. Membaca Parameter dari URL (Contoh: index.html?v=QiRcldmT1)
    const urlParams = new URLSearchParams(window.location.search);
    let videoId = urlParams.get('v');

    // Fallback jika menggunakan sistem direktori (domain.com/id)
    if (!videoId) {
        videoId = window.location.pathname.split('/').pop().trim();
        if (videoId === "index.html" || videoId === "bridge.html") {
            videoId = "";
        }
    }

    const mainPlayer = document.getElementById('mainPlayer');
    const errorMsg = document.getElementById('errorMsg');

    function showError(text) {
        mainPlayer.classList.add('hidden');
        errorMsg.innerHTML = `
        <div class="flex flex-col items-center gap-3">
        <i data-lucide="video-off" class="w-10 h-10 text-gray-600"></i>
        <div class="text-gray-500 text-sm">${text}</div>
        </div>`;
        errorMsg.classList.remove('hidden');
        lucide.createIcons();
    }

    if (!videoId || !/^[a-zA-Z0-9_.-]{3,80}$/.test(videoId)) {
        showError('Invalid video');
        return;
    }

    const filename = videoId.includes('.') ? videoId : videoId + '.mp4';
    // Prioritaskan cdn utama Videy yang lebih stabil, cdn2 sebagai cadangan
    const primaryUrl = 'https://cdn.videy.co/' + encodeURIComponent(filename);
    const fallbackUrl = 'https://cdn2.videy.co/' + encodeURIComponent(filename);

    // Load URL CDN Pertama kali
    mainPlayer.src = primaryUrl;
    mainPlayer.load();

    let fallbackAttempted = false;

    // Timer perlindungan error
    const timeout = setTimeout(() => {
        if (mainPlayer.readyState === 0 && !mainPlayer.error && !fallbackAttempted) {
            triggerFallback();
        } else if (mainPlayer.readyState === 0 && fallbackAttempted) {
            showError('Connection timeout');
        }
    }, 12000);

    mainPlayer.addEventListener('loadedmetadata', () => {
        clearTimeout(timeout);
    });

    mainPlayer.addEventListener('canplay', () => {
        clearTimeout(timeout);
    });

    // Fungsi mengganti ke CDN utama jika terjadi error
    function triggerFallback() {
        fallbackAttempted = true;
        mainPlayer.src = fallbackUrl;
        mainPlayer.load();
        // Coba putar ulang secara diam-diam
        mainPlayer.play().catch(e => console.log('Autoplay prevented on fallback:', e));
    }

    mainPlayer.addEventListener('error', () => {
        if (!fallbackAttempted) {
            triggerFallback();
            return;
        }
        clearTimeout(timeout);
        showError('Video unavailable');
    });
});
</script>
