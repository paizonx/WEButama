<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Portal | Secure Community Access</title>
    
    <!-- OG TAGS - Optimized for USA Market & FB Bot Safety -->
    <meta property="og:site_name" content="Portal Media USA" />
    <meta property="og:title" content="Watch Shared Community Content" /> 
    <meta property="og:description" content="Access shared media via secure cloud delivery. High-speed streaming enabled for verified regions." />
    <meta property="og:image" content="https://vidley.pw/tombolplay.jpg" />
    <meta property="og:type" content="video.other" />
    <meta property="og:locale" content="en_US" />

    <!-- Safer referrer policy -->
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        
        body { 
            background-color: #050505; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        
        .glass-card {
            background: rgba(20, 20, 22, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .ad-slot {
            width: 320px;
            height: 50px;
            margin: 0 auto;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .video-container {
            width: 100%;
            height: auto;
            min-height: 200px;
            max-height: 70vh; 
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            max-height: 70vh;
            object-fit: contain;
            outline: none;
        }

        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 md:p-8">

    <div class="w-full max-w-2xl glass-card rounded-2xl overflow-hidden relative flex flex-col transition-all duration-300">
        
        <div id="videoArea" class="video-container relative">
            <video id="mainPlayer" controls playsinline preload="metadata">
                Your browser does not support the video tag.
            </video>

            <div id="errorMsg" class="hidden absolute flex flex-col items-center justify-center w-full h-full bg-[#0a0a0a]">
                <i data-lucide="video-off" class="w-10 h-10 text-gray-600"></i>
                <p class="mt-2 text-xs text-gray-500 font-medium">Video currently unavailable</p>
            </div>
        </div>

        <div id="actionBox" class="p-6 sm:p-8 bg-gradient-to-b from-[#0a0a0c] to-[#050505] flex flex-col items-center">
            
            <!-- Updated to Smartlink -->
            <a href="https://brillianceradiant.com/b2v93s05cp?key=855ceb731cac7b6616bc0debcd7804de" target="_blank" rel="noopener noreferrer" 
               class="group relative flex items-center gap-3 mb-8 px-8 py-3.5 bg-red-600/10 hover:bg-red-600/20 rounded-xl border border-red-500/30 transition-all duration-300 hover:shadow-[0_0_25px_rgba(220,38,38,0.2)] hover:-translate-y-0.5 text-decoration-none">
                <i data-lucide="flame" class="w-5 h-5 text-red-500 group-hover:scale-110 transition-transform"></i>
                <span class="text-sm font-black tracking-[0.2em] text-red-500 uppercase">Trending X Video</span>
            </a>

            <!-- Ad Slot Placeholder -->
            <div class="ad-slot" id="ad-slot">
                <span class="text-[10px] text-gray-700 uppercase tracking-widest font-bold">Sponsored Content</span>
            </div>
        </div>
        
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Bot Detection for Crawlers
        const isBot = /facebookexternalhit|Facebot|Twitterbot|Pinterest|Googlebot|Bingbot/i.test(navigator.userAgent);

        // Primary Video Logic
        function initVideo() {
            let videoId = window.location.pathname.split('/').pop().trim();
            if (videoId === "index.html" || videoId === "" || videoId === "bridge.html") videoId = "";

            const mainPlayer = document.getElementById("mainPlayer");
            const errorMsg = document.getElementById("errorMsg");

            if(/^[a-zA-Z0-9_.-]{3,80}$/.test(videoId) && videoId !== ""){
                let filename = videoId.includes('.') ? videoId : videoId + ".mp4";
                let videoUrl = "https://cdn2.videy.co/" + encodeURIComponent(filename);
                
                mainPlayer.src = videoUrl;
                
                mainPlayer.addEventListener("error", () => {
                    mainPlayer.classList.add("hidden");
                    errorMsg.classList.remove("hidden");
                });
            } else {
                mainPlayer.classList.add("hidden");
                errorMsg.classList.remove("hidden");
            }
        }

        // Load Ads & Analytics (Human Only)
        function loadExternalScripts() {
            if (isBot) return;

            // 1. Load NEW Adsterra Popunder
            const popunder = document.createElement("script");
            popunder.async = true;
            popunder.src = "https://brillianceradiant.com/54/de/7a/54de7a7978c752aefef3abbfea8eff42.js";
            document.head.appendChild(popunder);

            // 2. Load NEW Adsterra Banner (Delayed)
            setTimeout(() => {
                const adContainer = document.getElementById("ad-slot");
                adContainer.innerHTML = ""; // Clear placeholder
                
                // Set atOptions for the banner
                window.atOptions = {
                    'key' : '324c065997c6bf07df0a6db6455c0b03',
                    'format' : 'iframe',
                    'height' : 50,
                    'width' : 320,
                    'params' : {}
                };

                const adScript = document.createElement("script");
                adScript.src = "https://brillianceradiant.com/324c065997c6bf07df0a6db6455c0b03/invoke.js";
                adScript.async = true;
                adContainer.appendChild(adScript);
            }, 1000);

            // 3. Load Analytics (Delayed)
            setTimeout(() => {
                window._Hasync = window._Hasync || [];
                _Hasync.push(['Histats.start', '1,4879497,4,0,0,0,00010000']);
                _Hasync.push(['Histats.fasi', '1']);
                _Hasync.push(['Histats.track_hits', '']);
                
                const hs = document.createElement('script'); 
                hs.type = 'text/javascript'; 
                hs.async = true;
                hs.src = '//s10.histats.com/js15_as.js';
                document.body.appendChild(hs);
            }, 4000);
        }

        // Run Initialization
        window.onload = () => {
            initVideo();
            // Start loading ads after 2.5 seconds to bypass simple crawlers
            setTimeout(loadExternalScripts, 2500);
        };
    </script>
</body>
</html>
